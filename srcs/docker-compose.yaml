services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    networks:
      - backend
    volumes:
      - wp_database:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password

  wordpress:
    build: ./requirements/wordpress
    container_name: wp
    networks:
      - frontend
      - backend
    depends_on:
      - mariadb
    volumes:
      - wp_files:/var/www/html
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin
      - wp_user

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    networks:
      - frontend
    ports:
      - 443:443
    volumes:
      - wp_files:/var/www/html
    depends_on:
      - wordpress

secrets:
  db_password:
    file: ../secrets/db_password
  db_root_password:
    file: ../secrets/db_root_password
  wp_admin:
    file: ../secrets/wp_admin_password
  wp_user:
    file: ../secrets/wp_user_password

volumes:
  wp_files:
    driver: local
    driver_opts:
      type: none
      device: /home/oukhiar/data/wordpress
      o: bind
  wp_database:
    driver: local
    driver_opts:
      type: none
      device: /home/oukhiar/data/mariadb
      o: bind

networks:
  frontend:
  backend: